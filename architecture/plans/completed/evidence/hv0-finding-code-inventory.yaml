_meta:
  title: HV-0.1 Finding Code Inventory
  plan: architecture/plans/HV-0-architecture-and-failure-baseline.md
  commit: 53efd014d87b34ca9e1189df9b37ed391f212b92
  date: '2026-08-12'
  method: Static extraction of first-positional-argument literals of _finding(...) calls (plan lines 62-72 recipe), plus code=
    literals passed to finding-emitting helpers (_unique_ids, _require_resolved_ids, _validate_primary_artifact), direct ValidationFinding(...)
    constructors (inputs.py; outputs.py:158), f-string composed codes (p2.{field}_empty, {code_prefix}.primary_artifact_not_represented),
    and dynamically composed codes (json.*, schema.<validator>). Non-code pN.* constants (mode names p2.focused_method, p3.theory_revision,
    p5.review_revision, p5.assembly; output/object-id literals p4.protocol, p4.decision, p5.assembly, p4.empirical_index_candidate,
    etc.) were manually excluded.
  counts:
    scientific_literals: 67
    submission_literals: 19
    input_literals: 7
    output_literals: 8
    json_load_error_codes: 5
    schema_dynamic_patterns: 1
    total_entries: 107
  default_policy_note: 'All codes are emitted with ValidationSeverity.ERROR and pass/fail is any(severity == ERROR) (domain/validation.py),
    so every code currently blocks publication (blocks_publication: true for all). The schema.<validator> code family is unbounded
    (jsonschema validator names) and must default to blocking under the HV-2 registry fail-closed policy.'
  provisional_class_legend:
    integrity_blocker: Plan 5.2 - identity/provenance/digest mismatches, unsafe paths, mode/phase violations; never silently
      repaired, no V1 override.
    correctable_contract_error: Plan 5.3 - shape/schema violations, missing or misshapen fields, duplicate or dangling references,
      malformed JSON; run enters needs_output_correction.
    scientific_claim_blocker: Plan 5.4 - claims/statements/evidence asserted without required support or exact-method binding;
      publication withheld.
    scientific_attention: Plan 5.5 - reserved; zero codes currently (all would require severity reclassification).
    information: Plan 5.6 - reserved; zero codes currently.
  class_counts:
    correctable_contract_error: 59
    integrity_blocker: 33
    scientific_claim_blocker: 15
