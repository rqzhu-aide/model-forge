<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f7f9" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0e14" />
    <script>
      // Apply the saved color theme before first paint to avoid a flash.
      (function () {
        var saved = null;
        try { saved = window.localStorage.getItem("model-forge-theme"); } catch (e) {}
        if (saved !== "light" && saved !== "dark") {
          saved = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = saved;
      })();
    </script>
    <meta
      name="description"
      content="Model Forge controlled research workflow interface"
    />
    <title>Model Forge</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
